<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6B66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RayonPilot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>RayonPilot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout : atelier de relevé — barre d'étapes en haut, plan de travail à gauche, fiche d'état à droite (empilée sur mobile) */
:root{
  --bg:#F1F3F0; --surface:#FFFFFF; --sunk:#E7EAE6; --ink:#1C232B; --muted:#5B6570; --line:#D6DBD5; --line-strong:#9AA39C;
  --accent:#0B6B66; --accent-ink:#FFFFFF; --tag:#F2C230; --tag-ink:#1C232B;
  --ok:#2E7D32; --warn:#9A5B00; --bad:#B3261E; --ok-bg:#E3F1E4; --warn-bg:#FBEFD9; --bad-bg:#F9E1DF;
  --fix:#F7F8F6; --board:#7D8781;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --surface:#192027; --sunk:#141A20; --ink:#E6EAED; --muted:#9BA6B0; --line:#2B343D; --line-strong:#55606A;
  --accent:#3DB5AC; --accent-ink:#08201E; --tag:#E8B923; --tag-ink:#1C232B;
  --ok:#6CC070; --warn:#F0A94A; --bad:#F07068; --ok-bg:#1B3020; --warn-bg:#36290F; --bad-bg:#3A1C1A;
  --fix:#1E262E; --board:#7D8781; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#192027; --sunk:#141A20; --ink:#E6EAED; --muted:#9BA6B0; --line:#2B343D; --line-strong:#55606A;
  --accent:#3DB5AC; --accent-ink:#08201E; --tag:#E8B923; --tag-ink:#1C232B;
  --ok:#6CC070; --warn:#F0A94A; --bad:#F07068; --ok-bg:#1B3020; --warn-bg:#36290F; --bad-bg:#3A1C1A;
  --fix:#1E262E; --board:#7D8781; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:26px} h3{font-size:19px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
a{color:var(--accent)}
.wrap{max-width:1280px;margin:0 auto}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:30px;text-transform:uppercase;letter-spacing:.04em}
.brand .tagline{color:var(--muted);font-size:13px}
.logo{display:inline-block;width:22px;height:22px;position:relative;top:3px;border:2.5px solid var(--ink);border-top:none}
.logo::before,.logo::after{content:"";position:absolute;left:2px;right:2px;height:2.5px;background:var(--ink)}
.logo::before{top:6px}.logo::after{top:12px}
.proj{margin-left:auto;display:flex;align-items:center;gap:8px}
.proj input{width:220px;max-width:50vw}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--tag);color:var(--tag-ink);border-radius:4px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.banner b{font-weight:600}
.banner button{background:transparent;border:1.5px solid var(--tag-ink);color:var(--tag-ink)}
nav.steps{display:flex;gap:2px;overflow-x:auto;border-bottom:1.5px solid var(--line);margin-bottom:18px;scrollbar-width:thin}
nav.steps button{background:none;border:none;border-bottom:3px solid transparent;border-radius:0;padding:10px 14px 9px;color:var(--muted);font-family:var(--f-display);font-size:17px;font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center;margin-bottom:-1.5px}
nav.steps button .n{font-family:var(--f-mono);font-size:11px;border:1.5px solid currentColor;border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center}
nav.steps button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.steps button .dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
nav.steps button .dot.ok{background:var(--ok)} nav.steps button .dot.warn{background:var(--warn)} nav.steps button .dot.bad{background:var(--bad)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
main{min-width:0}
section.panel{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.card > h3{margin-bottom:10px}
.head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:6px 8px;min-width:0;width:100%}
textarea{font-family:var(--f-mono);font-size:12.5px;min-height:110px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;font-weight:500}
button:hover{border-color:var(--ink)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button.ghost{border-color:transparent;background:transparent;padding:4px 8px}
button.ghost:hover{background:var(--sunk)}
button:disabled{opacity:.5;cursor:not-allowed}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:none}
tr.sel td{background:color-mix(in srgb,var(--tag) 22%,transparent)}
td input[type=number]{width:72px} td select{min-width:150px} td input[type=text]{min-width:140px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.neutral{background:var(--sunk);color:var(--muted)}
.chip.tag{background:var(--tag);color:var(--tag-ink)}
.issues{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.issues li{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:4px;font-size:13px}
.issues li.bad{background:var(--bad-bg);color:var(--ink);border-left:3px solid var(--bad)}
.issues li.warn{background:var(--warn-bg);color:var(--ink);border-left:3px solid var(--warn)}
.issues li.ok{background:var(--ok-bg);color:var(--ink);border-left:3px solid var(--ok)}
.issues li .go{margin-left:auto}
/* fiche latérale */
aside{position:sticky;top:12px;display:grid;gap:14px}
@media (max-width:980px){aside{position:static}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sheet .label-strip{background:var(--tag);color:var(--tag-ink);padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sheet .label-strip .big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.sheet .label-strip .u{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sheet .body{padding:12px 14px;display:grid;gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.kv span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.warn i{background:var(--warn)} .meter.bad i{background:var(--bad)}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.checklist li{display:flex;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line)}
.checklist li:last-child{border-bottom:none}
.checklist .st{margin-left:auto}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12px}
.hist li{display:flex;gap:8px;justify-content:space-between}
/* photo */
.drop{border:1.5px dashed var(--line-strong);border-radius:6px;padding:22px;text-align:center;color:var(--muted);background:var(--sunk)}
.drop.over{border-color:var(--accent);color:var(--ink)}
.photo-wrap{position:relative;display:inline-block;max-width:100%;user-select:none;touch-action:none;line-height:0}
.photo-wrap img{display:block;max-width:100%;max-height:70vh;border-radius:4px}
.photo-wrap.drawing{cursor:crosshair}
.bx{position:absolute;border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);line-height:1.2}
.bx.c-moyenne{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.bx.c-faible{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);border-style:dashed}
.bx.validee{border-color:var(--ok);border-style:solid}
.bx.sel{outline:3px solid var(--tag);outline-offset:1px;z-index:2}
.bx span{position:absolute;top:-1px;left:-1px;background:var(--ink);color:var(--surface);font:600 10.5px/1 var(--f-mono);padding:2px 4px;border-radius:0 0 3px 0}
.bx.tmp{border-style:dashed;border-color:var(--tag)}
.ai-status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:4px;background:var(--sunk);font-size:13px}
.spinner{width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
/* planogramme */
.plano-box{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--sunk);padding:8px}
.plano-box svg{display:block;width:100%;min-width:640px;height:auto}
.plano-title{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 12px;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.rule{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:4px;font-size:13px}
.rule small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:var(--surface)}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:5px;font-size:13px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.mapping{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.obj{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:13px}
.obj small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35;margin-top:2px}
.obj.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line-strong);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.pill.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.grp{margin:14px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.grp:first-of-type{margin-top:0}
.gen-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.plan-stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:10px}
.plan-stack > div{min-width:0}
.shelf-photo{padding:0;line-height:0}.shelf-photo img{display:block;width:100%;max-height:520px;object-fit:contain}
details.card > summary{cursor:pointer;list-style-position:outside}
.thumb{display:inline-grid;place-items:center;width:38px;height:38px;border:1px dashed var(--line-strong);border-radius:3px;cursor:pointer;overflow:hidden;font-size:9.5px;color:var(--muted);text-align:center;line-height:1.1}
.thumb img{width:100%;height:100%;object-fit:cover}
.visually-hidden{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.photo-btns{gap:8px}
.tips{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.bnav,.mstatus{display:none}
.dcards{display:grid;gap:10px;margin-top:10px}
.dcard{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface)}
.dcard.sel{border-color:var(--tag);box-shadow:0 0 0 2px var(--tag)}
.dcard.ok{border-left:4px solid var(--ok)}
.dthumb{width:76px;height:76px;border-radius:4px;background-color:var(--sunk);background-image:var(--ph);background-repeat:no-repeat}
.dthumb.empty{background-image:none;display:grid;place-items:center;font-family:var(--f-display);font-size:24px;color:var(--muted)}
.dbody{display:grid;gap:8px;min-width:0}
.dtop{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.steppers{display:flex;gap:14px;flex-wrap:wrap}
.stp{display:grid;gap:2px}
.stp-c{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.stp-c button{border:none;border-radius:0;width:44px;min-height:40px;font-size:20px;line-height:1;padding:0;background:var(--sunk)}
.stp-c output{min-width:40px;text-align:center;font-family:var(--f-mono);font-size:16px}
.dimcards{display:grid;gap:10px}
.dimcard{border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.dimgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.plano-box.z-fit svg{min-width:0}
.plano-box.z-2 svg{width:200%;min-width:1280px}
.plano-box:fullscreen{background:var(--bg);display:grid;place-items:center;padding:12px;overflow:auto}
.plano-box:fullscreen svg{width:auto;max-width:100%;max-height:calc(100vh - 24px);min-width:0}
@media (max-width:720px){
  nav.steps{display:none}
  .bnav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
    padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));box-shadow:0 -4px 14px rgba(0,0,0,.08)}
  .bnav button{border:none;background:none;display:grid;justify-items:center;align-content:center;gap:2px;font-size:10.5px;font-weight:600;padding:4px 2px;min-height:54px;color:var(--muted);border-radius:6px;position:relative}
  .bnav button[aria-selected="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .bnav svg{width:22px;height:22px}
  .bnav .dot{position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;border:1.5px solid var(--surface)}
  .bnav .dot.ok{background:var(--ok)}.bnav .dot.warn{background:var(--warn)}.bnav .dot.bad{background:var(--bad)}
  body{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .mstatus{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-bottom:14px;font-size:13px}
  .mstatus .grow{flex:1;min-width:0}
  aside{display:none}
  aside.open{display:grid;margin-bottom:14px}
  .layout{display:flex;flex-direction:column-reverse}
  input[type=text],input[type=number],select,textarea{font-size:16px}
  button,.btn{min-height:44px}
  button.ghost{min-height:40px}
  .seg button{min-height:40px}
  h2{font-size:24px}
  .brand h1{font-size:26px}
  .brand .tagline{display:none}
  header.top{padding-block:12px 8px}
  .proj{margin-left:0;width:100%}.proj input{max-width:none;width:100%}
  .card{padding:14px}
  .head p{font-size:13px}
  .banner{font-size:12.5px}
  .banner .row{width:100%;margin-left:0}
  .banner button{flex:1}
  .gen-bar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 4px 18px rgba(0,0,0,.14)}
  .gen-bar .small{flex-basis:100%}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
  .photo-wrap img{max-height:none}
}
.confirm-box{border:1.5px solid var(--warn);background:var(--warn-bg);border-radius:4px;padding:10px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span><h1>RayonPilot</h1><span class="tagline">Prototype — photo de rayon → planogramme 2D</span></div>
    <div class="proj"><label class="small muted" for="projName">Projet</label><input type="text" id="projName"></div>
  </header>
  <div class="banner" id="exampleBanner" hidden>
    <span id="bannerText"></span>
    <span class="row" style="margin-left:auto;gap:8px"><button id="btnSwap"></button><button id="btnNew">Commencer un projet vide</button></span>
  </div>
  <div class="mstatus" id="mstatus"></div>
  <nav class="steps" role="tablist" id="steps"></nav>
  <div class="layout">
    <main id="main"></main>
    <aside id="side"></aside>
  </div>
</div>
<nav class="bnav" id="bnav" aria-label="Étapes"></nav>

function shelvesGeom(){
  let b=S.fixture.base;const out=S.fixture.shelves.map((cl,i)=>{const o={i,clear:cl,bottom:b};b+=cl;return o});
  const maxB=Math.max(1,...out.map(o=>o.bottom));
  out.forEach(o=>{const eye=o.bottom+Math.min(o.clear,25)/2;o.eye=eye;o.value=eye<50?0.55:eye<90?0.75:eye<120?0.9:eye<=165?1:0.7;o.hn=o.bottom/maxB;
    o.zone=eye<50?'Bas (sol)':eye<90?'Bas de main':eye<120?'Mains':eye<=165?'Yeux':'Haut'});
  return out;
}
function dimState(p){
  if(!p)return 'missing';
  if(!(p.w>0&&p.h>0&&p.d>0)||p.dimSrc==='inconnue')return 'missing';
  if(p.dimSrc==='estimee'&&!p.dimOk)return 'tovalidate';

/* ---------- contrôles bloquants (PRD §8.2, §18) ---------- */
function checks(){
  const bad=[],warn=[];const F=S.fixture;
  if(!F.validated)bad.push({t:'Les dimensions du mobilier ne sont pas validées.',go:'fixture'});
  if(shelfSum()+F.base>F.height)bad.push({t:`Les étagères (${fmt(shelfSum()+F.base)} cm avec le socle) dépassent la hauteur du meuble (${fmt(F.height)} cm).`,go:'fixture'});
  if(!S.detections.length)bad.push({t:'Aucune détection : importez une photo et lancez l’analyse, ou ajoutez les produits à la main.',go:'photo'});
  const unm=S.detections.filter(d=>!d.productId);
  if(unm.length)bad.push({t:`${unm.length} détection(s) ne sont associées à aucune référence du catalogue.`,go:'photo'});
  const low=S.detections.filter(d=>d.conf==='faible'&&d.status!=='validee');
  if(low.length)bad.push({t:`${low.length} détection(s) à confiance faible doivent être vérifiées.`,go:'photo'});
  const mid=S.detections.filter(d=>d.conf==='moyenne'&&d.status!=='validee');
  if(mid.length)warn.push({t:`${mid.length} détection(s) à confiance moyenne non vérifiées.`,go:'photo'});
  usedProducts().forEach(p=>{if(p.lockShelf&&p.lockShelf>F.shelves.length)bad.push({t:`${p.name} est imposé sur l’étagère ${p.lockShelf}, qui n’existe plus.`,go:'plan'})});
  const sh=S.detections.filter(d=>d.shelf<1||d.shelf>F.shelves.length);
  if(sh.length)bad.push({t:`${sh.length} détection(s) placée(s) sur une étagère qui n’existe pas.`,go:'photo'});
  usedProducts().forEach(p=>{const st=dimState(p);
    if(st==='missing')bad.push({t:`Dimensions manquantes : ${p.name} (${p.brand}).`,go:'dims'});
    if(st==='tovalidate')bad.push({t:`Dimensions estimées à confirmer : ${p.name} (${p.brand}).`,go:'dims'});
    if(p.d>F.depth)bad.push({t:`${p.name} est plus profond (${fmt(p.d,1)} cm) que les étagères (${fmt(F.depth)} cm).`,go:'dims'});
  });
  const up=usedProducts();
  if(up.length&&!up.some(p=>p.ca>0||p.margin>0||p.qty>0))warn.push({t:'Aucune donnée commerciale : l’optimisation ne s’appuiera que sur les règles physiques et de présentation.',go:'catalog'});
  return {bad,warn};
}

function beforeLayout(){
  const n=S.fixture.shelves.length;const L=Array.from({length:n},()=>[]);
  const ds=[...S.detections].sort((a,b)=>(a.box?a.box[0]:0)-(b.box?b.box[0]:0));
  ds.forEach(d=>{if(d.shelf>=1&&d.shelf<=n)L[d.shelf-1].push({pid:d.productId,f:d.facings,label:d.label,estW:d.estW,estH:d.estH})});
  return L;
}
function aggregateBefore(){
  const m={};S.detections.forEach(d=>{if(!d.productId)return;const p=prod(d.productId);if(!p)return;
    const o=m[p.id]||(m[p.id]={p,f:0,shelfF:{}});o.f+=d.facings;o.shelfF[d.shelf]=(o.shelfF[d.shelf]||0)+d.facings});
  Object.values(m).forEach(o=>{o.shelf=+Object.entries(o.shelfF).sort((a,b)=>b[1]-a[1])[0][0];o.lin=o.f*(o.p.w||0)});
  return m;
}

/* ---------- moteur d'optimisation (déterministe, séparé de la vision) ---------- */
const OBJ=[
  ['ca','Chiffre d’affaires','Plus de place aux références qui portent le CA.'],
  ['marge','Marge brute','Favorise les références les plus rémunératrices.'],
  ['rotation','Rotation (unités)','Place proportionnelle aux volumes vendus.'],
  ['rentabilite','Rentabilité du linéaire','Marge × coefficient de rotation (ventes ÷ stock moyen).'],
  ['couverture','Couverture de stock','Facings calculés pour tenir N jours de ventes et limiter les ruptures.'],
  ['is','Indices de sensibilité','Méthode du cours : place actuelle × indice moyen (CA, marge, quantités).'],
  ['promo','Mise en avant','Promotions et nouveautés d’abord, puis le CA.'],
  ['equilibre','Équilibre multi-objectif','Moyenne des parts de CA, de marge et de quantités.']];
const SECONDARY=[['ca','CA'],['marge','Marge'],['rotation','Rotation'],['rentabilite','Rentabilité']];
const OBJ_LABEL=Object.fromEntries(OBJ.map(o=>[o[0],o[1]]));
function arrange(seq,scoreOf,mode){
  if(mode==='perf')return [...seq].sort((a,b)=>scoreOf(b)-scoreOf(a));
  if(mode==='tiers'||mode==='hot'){
    const s=[...seq].sort((a,b)=>mode==='tiers'?scoreOf(b)-scoreOf(a):scoreOf(a)-scoreOf(b));const r=[];
    s.forEach((x,i)=>i%2?r.unshift(x):r.push(x));return r}
  return seq;
}
function optimize(){
  const {bad,warn}=checks();
  if(bad.length)return {blocking:bad,warnings:warn};
  const st=S.settings,R=st.rules,F=S.fixture,L=totalLen();
  const before=aggregateBefore();
  const excluded=Object.values(before).filter(o=>o.p.exclude);
  const items=Object.values(before).filter(o=>!o.p.exclude);
  const warnings=[...warn];
  if(excluded.length)warnings.push({t:`${excluded.length} référence(s) exclue(s) du plan : ${excluded.map(o=>o.p.name).join(', ')}.`});
  if(!items.length)return {blocking:[{t:'Toutes les références sont exclues du plan.',go:'plan'}],warnings};
  const metric={ca:o=>o.p.ca||0,marge:o=>o.p.margin||0,rotation:o=>o.p.qty||0,
    rentabilite:o=>(o.p.margin||0)*(o.p.stock>0?(o.p.qty||0)/o.p.stock:(o.p.qty||0))};
  const has={};const shareOf={};
  Object.keys(metric).forEach(k=>{const t=items.reduce((a,o)=>a+metric[k](o),0);has[k]=t>0;shareOf[k]=o=>t>0?metric[k](o)/t:1/items.length});
  const linTot=items.reduce((a,o)=>a+o.lin,0)||1;
  const isOf=o=>{const ls=o.lin/linTot;const v=['ca','marge','rotation'].filter(k=>has[k]&&ls>0).map(k=>shareOf[k](o)/ls);return v.length?v.reduce((a,b)=>a+b,0)/v.length:1};
  const obj=st.objective;
  const need={ca:'ca',marge:'marge',rotation:'rotation',rentabilite:'rentabilite',couverture:'rotation',promo:'ca'}[obj];
  if(need&&!has[need])warnings.push({t:`L’objectif « ${OBJ_LABEL[obj]} » manque de données (${need==='rotation'?'unités vendues':need==='rentabilite'?'marge et unités':need}) : répartition égale par défaut.`});
  items.forEach(o=>{let s;
    if(obj==='equilibre'){const ks=['ca','marge','rotation'].filter(k=>has[k]);s=ks.length?ks.reduce((a,k)=>a+shareOf[k](o),0)/ks.length:1/items.length}
    else if(obj==='is'){s=o.lin*isOf(o)}
    else if(obj==='promo'){s=shareOf.ca(o)+((o.p.promo||o.p.nouveau)?1:0)}
    else if(obj==='couverture'){s=shareOf.rotation(o)}
    else s=shareOf[obj](o);
    (st.secondary||[]).forEach(k=>{if(k!==obj&&has[k])s+=0.35*shareOf[k](o)});
    o.score=s});
  const tot=items.reduce((a,o)=>a+o.score,0)||1;items.forEach(o=>o.score/=tot);
  if(obj==='is'&&!['ca','marge','rotation'].some(k=>has[k]))warnings.push({t:'Sans données commerciales, les indices de sensibilité valent 1 : la place actuelle est conservée.'});
  const geo=shelvesGeom();const MLD=L*geo.length;const usable=MLD*0.96;
  const maxVol=Math.max(...items.map(o=>o.p.w*o.p.h*o.p.d));
  const visMin=R.vis?st.vis:0;const covOver=[];
  items.forEach(o=>{const p=o.p;
    const perDay=(p.qty||0)/(st.periodDays||30);const cap=Math.max(1,Math.floor(F.depth/p.d));o.cap=cap;o.perDay=perDay;
    o.covF=perDay>0?Math.max(1,Math.ceil(perDay*st.coverDays/cap-1e-9)):1;
    const bulky=p.oneFacing==='yes'||(p.oneFacing!=='no'&&R.bulky&&p.w*p.h>=st.bulkyArea);o.bulky=bulky;
    let minF=bulky?1:Math.max(1,Math.ceil(visMin/p.w-1e-9));
    if(R.news&&(p.nouveau||p.promo))minF=Math.max(minF,2);
    if(R.coverage&&perDay>0)minF=Math.max(minF,o.covF);
    let maxF=R.sat?Math.max(1,Math.floor(st.sat/p.w)):Infinity;
    if(minF>maxF){if(R.coverage&&o.covF>maxF)covOver.push(`${p.name} (${p.brand}) : ${o.covF}`);maxF=minF}
    if(p.minF>0)minF=p.minF;if(p.maxF>0)maxF=p.maxF;if(minF>maxF)minF=maxF;
    o.minF=minF;o.maxF=maxF;
    const raw=obj==='couverture'?o.covF:obj==='is'&&!['ca','marge','rotation'].some(k=>has[k])?o.f:Math.round(o.score*usable/p.w);
    o.target=Math.min(maxF,Math.max(minF,raw));
    o.vr=(p.w*p.h*p.d)/maxVol});
  if(covOver.length)warnings.push({t:`Couverture de ${st.coverDays} j : facings imposés au-delà du seuil de saturation pour ${covOver.join(' ; ')}.`});
  // zones (disposition horizontale = une zone ; verticale = une colonne par catégorie ou marque)
  const keyOf=st.layout==='vert_brand'?(p=>p.brand):st.layout==='vert_cat'?(p=>p.cat):(()=>'Rayon');
  const gm=new Map();items.forEach(o=>{const k=keyOf(o.p);if(!gm.has(k))gm.set(k,{key:k,items:[],score:0});const g=gm.get(k);g.items.push(o);g.score+=o.score});
  let zones=[...gm.values()].sort((a,b)=>b.score-a.score);
  const blocking=[];
  if(zones.length===1)zones[0].w=L;
  else{
    zones.forEach(z=>{const area=z.items.reduce((a,o)=>{const ns=Math.max(1,geo.filter(g=>o.p.h<=g.clear-1).length);return a+o.p.w*o.minF/ns},0);
      z.minW=Math.max(...z.items.map(o=>o.p.w*o.minF),area*1.02);z.w=Math.max(z.minW,L*z.score)});
    const minSum=zones.reduce((a,z)=>a+z.minW,0);
    if(minSum>L+1e-9)blocking.push({t:`Disposition verticale impossible : les ${zones.length} blocs demandent au moins ${fmt(minSum)} cm pour ${fmt(L)} cm disponibles. Passez en disposition horizontale ou réduisez le seuil de visibilité.`,go:'plan'});
    else{let guard=0;while(guard++<50){const sum=zones.reduce((a,z)=>a+z.w,0);const ex=sum-L;if(Math.abs(ex)<0.01)break;
        const slack=zones.reduce((a,z)=>a+(ex>0?z.w-z.minW:1),0);if(slack<=0)break;zones.forEach(z=>{z.w-=ex*(ex>0?(z.w-z.minW):1)/slack;z.w=Math.max(z.minW,z.w)})}
      zones.forEach(z=>z.w=Math.floor(z.w*2)/2);zones[zones.length-1].w+=L-zones.reduce((a,z)=>a+z.w,0)}
  }
  if(blocking.length)return {blocking,warnings};
  const ranked=arr=>{const s=[...arr].sort((a,b)=>(a.p.price||0)-(b.p.price||0));const m=new Map();s.forEach((o,i)=>m.set(o,s.length>1?i/(s.length-1):0.5));return m};
  zones.forEach(z=>{
    z.sh=geo.map(g=>({...g,used:0,res:0,items:[]}));const pr=ranked(z.items);
    [...z.items].sort((a,b)=>b.score-a.score).forEach(o=>{const p=o.p;
      let cands=z.sh.filter(s=>p.h<=s.clear-1&&p.d<=F.depth);
      if(p.lockShelf){cands=cands.filter(s=>s.i+1===p.lockShelf);
        if(!cands.length){blocking.push({t:`${p.name} est imposé sur l’étagère ${p.lockShelf}, mais il n’y tient pas (hauteur ${fmt(p.h,1)} cm, dégagement ${fmt(F.shelves[p.lockShelf-1])} cm).`,go:'plan'});return}}
      if(!cands.length){blocking.push({t:`${p.name} (${fmt(p.h,1)} cm de haut) ne tient sur aucune étagère : dégagement maximal utile ${fmt(Math.max(...F.shelves)-1)} cm.`,go:'fixture'});return}
      let best=null;
      cands.forEach(s=>{const f0=o.minF;
        const room=Math.floor((z.w-s.used)/p.w+1e-9);const f=Math.min(f0,room);if(f<1)return;
        let pref=s.value*(1+o.score*2)+0.25*(z.w-s.used)/z.w;
        if(R.phys)pref+=1.6*o.vr*o.vr*(0.5-s.hn);
        if(R.priceVert)pref+=1.2*(pr.get(o)-0.5)*(s.hn-0.5);
        if(R.news&&(p.nouveau||p.promo)&&s.value>=1)pref+=0.8;
        if(R.mdd&&p.mdd&&s.items.some(it=>{const q=prod(it.pid);return !q.mdd&&q.cat===p.cat}))pref+=2;
        if(f<o.minF)pref-=1;
        const need=Math.max(f,o.target)*p.w;if(z.w-s.res<need-1e-9)pref-=1.5*(1-Math.max(0,z.w-s.res)/need);
        if(!best||pref>best.pref)best={s,f,pref}});
      if(!best&&zones.length>1){z.overflow=z.overflow||[];z.overflow.push(o);return}
      if(!best){blocking.push({t:`Place insuffisante pour ${p.name} (${p.brand}) : aucune étagère compatible n’a ${fmt(p.w,1)} cm libres.`,go:'fixture'});return}
      best.s.used+=best.f*p.w;best.s.res+=Math.max(best.f,o.target)*p.w;const it={pid:p.id,f:best.f};best.s.items.push(it);o.slots=[{s:best.s,it}];o.after={shelf:best.s.i+1,f:best.f};
      if(best.f<o.minF)warnings.push({t:`${p.name} (${p.brand}) : ${best.f} facing(s), sous son minimum (${o.minF}) faute de place.`})});
  });
  zones.forEach((z,zi)=>(z.overflow||[]).forEach(o=>{const p=o.p;
    const order2=zones.map((zz,i)=>({zz,d:Math.abs(i-zi)})).filter(x=>x.zz!==z).sort((a,b)=>a.d-b.d).map(x=>x.zz);
    for(const zz of order2){const s=zz.sh.filter(s=>p.h<=s.clear-1&&(!p.lockShelf||s.i+1===p.lockShelf)&&zz.w-s.used>=p.w).sort((a,b)=>b.value-a.value)[0];
      if(s){const f=Math.max(1,Math.min(o.minF,Math.floor((zz.w-s.used)/p.w+1e-9)));const it={pid:p.id,f};s.items.push(it);s.used+=f*p.w;o.slots=[{s,it}];o.after={shelf:s.i+1,f};
        zz.items.push(o);warnings.push({t:`${p.name} (${p.brand}) placé hors de son bloc « ${z.key} », dans « ${zz.key} », faute de place.`});return}}
    blocking.push({t:`Place insuffisante pour ${p.name} (${p.brand}) : aucun bloc n’a ${fmt(p.w,1)} cm libres sur une étagère compatible.`,go:'plan'})}));
  if(blocking.length)return {blocking,warnings};
  // espace restant : seulement aux références sous-représentées, jusqu'à saturation.
  // En disposition verticale, une référence peut s'étendre sur d'autres étagères de son bloc.
  const vertical=zones.length>1||st.layout!=='horizontal';
  zones.forEach(z=>{const zs=z.items.reduce((a,o)=>a+o.score,0)||1;const zcap=z.w*geo.length*0.96;let guard=0;
    while(guard++<4000){let pick=null,bestGap=0;
      for(const o of z.items){const p=o.p;const tf=o.slots.reduce((a,sl)=>a+sl.it.f,0);
        if(obj==='couverture'&&tf>=o.target)continue;
        const comp=R.levelComp?1/o.slots[0].s.value:1;
        const tgt=obj==='couverture'?o.target*p.w:o.score/zs*zcap*comp;const gap=(tgt-tf*p.w)/Math.max(tgt,1);if(gap<=bestGap)continue;
        let c=o.slots.find(sl=>sl.it.f<o.maxF&&sl.s.used+p.w<=z.w+1e-9);
        if(c){bestGap=gap;pick={o,grow:c};continue}
        if(vertical&&!p.lockShelf){const main=o.slots[0].s.i;
          const ns=z.sh.filter(s=>p.h<=s.clear-1&&!o.slots.some(sl=>sl.s===s)&&z.w-s.used>=p.w*Math.min(o.minF,2)-1e-9).sort((a,b)=>Math.abs(a.i-main)-Math.abs(b.i-main))[0];
          if(ns){bestGap=gap;pick={o,add:ns}}}}
      if(!pick)break;const o=pick.o,w=o.p.w;
      if(pick.grow){pick.grow.it.f++;pick.grow.s.used+=w}
      else{const f=Math.max(1,Math.min(o.minF,Math.floor((z.w-pick.add.used)/w+1e-9)));const it={pid:o.p.id,f};pick.add.items.push(it);pick.add.used+=f*w;o.slots.push({s:pick.add,it})}
      o.after.f=o.slots.reduce((a,sl)=>a+sl.it.f,0)}});
  // ordre de présentation dans chaque étagère de chaque zone
  const sc=pid=>before[pid].score;
  const blockKey=st.blocking==='brand'?(p=>p.brand):st.blocking==='cat'?(p=>p.cat):null;
  zones.forEach(z=>z.sh.forEach(s=>{
    const inner=arr=>st.order==='gradient'?[...arr].sort((a,b)=>(prod(a.pid).price||0)-(prod(b.pid).price||0)):arrange(arr,it=>sc(it.pid),st.order==='gradient'?'perf':st.order);
    let seq;
    if(blockKey){const bm=new Map();s.items.forEach(it=>{const k=blockKey(prod(it.pid));if(!bm.has(k))bm.set(k,[]);bm.get(k).push(it)});
      let blocks=[...bm.values()];const bs=b=>b.reduce((a,it)=>a+sc(it.pid),0);
      blocks=st.order==='gradient'?blocks.sort((a,b)=>Math.min(...a.map(i=>prod(i.pid).price||0))-Math.min(...b.map(i=>prod(i.pid).price||0))):arrange(blocks,bs,st.order);
      seq=blocks.flatMap(b=>st.order==='gradient'?inner(b):[...b].sort((x,y)=>sc(y.pid)-sc(x.pid)))}
    else seq=inner(s.items);
    if(st.flow==='rtl')seq.reverse();
    if(R.mdd){seq.filter(it=>prod(it.pid).mdd).forEach(m=>{const pm=prod(m.pid);
      const leaders=seq.filter(it=>{const p=prod(it.pid);return !p.mdd&&p.cat===pm.cat});if(!leaders.length)return;
      const lead=leaders.sort((a,b)=>(prod(b.pid).ca||0)-(prod(a.pid).ca||0))[0];
      seq.splice(seq.indexOf(m),1);seq.splice(seq.indexOf(lead)+1,0,m)})}
    s.items=seq}));
  if(st.flow==='rtl')zones.reverse();
  let x0=0;zones.forEach(z=>{z.x0=x0;x0+=z.w});
  const after=geo.map((g,si)=>{const out=[];zones.forEach((z,zi)=>{const s=z.sh[si];out.push(...s.items);if(zi<zones.length-1&&z.w-s.used>0.01)out.push({gap:z.w-s.used})});return out});
  const usedAll=zones.reduce((a,z)=>a+z.sh.reduce((b,s)=>b+s.used,0),0);const fill=usedAll/MLD;
  if(fill<0.85)warnings.push({t:`${fmt((1-fill)*MLD/100,2)} m de linéaire développé restent libres${R.sat?' (seuil de saturation atteint)':''} : ajoutez des références ou réduisez le nombre d’étagères.`});
  const rows=items.map(o=>{const p=o.p;const ls=o.lin/linTot;const is=k=>has[k]&&ls>0?shareOf[k](o)/ls:null;
    const cov=f=>o.perDay>0?f*o.cap/o.perDay:null;
    return {pid:p.id,before:{shelf:o.shelf,f:o.f,lin:o.lin,cov:cov(o.f)},after:{shelf:o.after.shelf,shelves:o.slots.map(sl=>sl.s.i+1).sort((a,b)=>a-b),f:o.after.f,lin:o.after.f*p.w,cov:cov(o.after.f)},
      isCA:is('ca'),isMB:is('marge'),isQ:is('rotation'),score:o.score,minF:o.minF,maxF:o.maxF,bulky:o.bulky}});
  return {v2:true,after,zones:zones.length>1?zones.map(z=>({key:z.key,x0:z.x0,w:z.w})):null,rows,fill,warnings,objective:obj,secondary:[...(st.secondary||[])],
    settings:JSON.parse(JSON.stringify(st)),date:new Date().toISOString(),has};
}

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function genPack(p){
  const W=120,H=Math.max(60,Math.round(120*p.h/p.w));const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle=colorFor(p);x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.86)';x.fillRect(8,H*0.30,W-16,H*0.42);
  x.fillStyle='rgba(0,0,0,.72)';x.fillRect(0,0,W,H*0.18);
  x.fillStyle='#fff';x.font=`600 ${Math.round(W*0.12)}px sans-serif`;x.textAlign='center';x.fillText(p.brand.slice(0,12),W/2,H*0.13);
  x.fillStyle='#1c232b';x.font=`600 ${Math.round(W*0.10)}px sans-serif`;
  const words=p.name.split(' ');let line='',y=H*0.30+W*0.14,lines=0;
  for(const w of words){const t=line?line+' '+w:w;if(x.measureText(t).width>W-24&&line){x.fillText(line,W/2,y);y+=W*0.12;line=w;if(++lines>=3)break}else line=t}
  if(lines<3)x.fillText(line,W/2,y);
  if(p.mdd){x.fillStyle='rgba(0,0,0,.72)';x.fillRect(0,H*0.86,W,H*0.14);x.fillStyle='#fff';x.font=`600 ${Math.round(W*0.09)}px sans-serif`;x.fillText('MDD',W/2,H*0.96)}
  return c.toDataURL('image/jpeg',0.82);
}
async function cropFromPhoto(){
  if(!photoMem)return false;let img;try{img=await loadImg(photoMem)}catch(e){return false}
  const rank={elevee:3,moyenne:2,manuelle:2,faible:1};const best={};
  S.detections.forEach(d=>{if(!d.box||!d.productId)return;const v=(rank[d.conf]||0)+(d.status==='validee'?1:0);if(!best[d.productId]||v>best[d.productId].v)best[d.productId]={d,v}});
  let n=0;
  Object.entries(best).forEach(([pid,{d}])=>{const p=prod(pid);if(!p||p.imgSrc==='upload')return;
    const sw=d.box[2]*img.width/Math.max(1,d.facings),sh=d.box[3]*img.height;if(sw<4||sh<4)return;
    const s=Math.min(1,180/Math.max(sw,sh));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*s));c.height=Math.max(1,Math.round(sh*s));
    c.getContext('2d').drawImage(img,d.box[0]*img.width,d.box[1]*img.height,sw,sh,0,0,c.width,c.height);p.img=c.toDataURL('image/jpeg',0.8);p.imgSrc='photo';n++});
  if(n)save();return n>0;
}
async function uploadProductImg(p,file){
  try{const url=URL.createObjectURL(file);const img=await loadImg(url);const s=Math.min(1,200/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    p.img=c.toDataURL('image/jpeg',0.82);p.imgSrc='upload';URL.revokeObjectURL(url);save();renderAll()}catch(e){toast('Image illisible.')}
}

const PAL=[[205,52,64],[28,70,62],[140,40,58],[350,52,66],[48,72,58],[265,38,68],[175,45,52],[10,45,55],[90,40,58],[320,35,64],[220,25,62],[60,30,55]];
function colorFor(p){if(!p)return 'hsl(0 0% 72%)';const brands=[...new Set(S.catalog.map(x=>x.brand))];const c=PAL[Math.max(0,brands.indexOf(p.brand))%PAL.length];return `hsl(${c[0]} ${c[1]}% ${c[2]}%)`}
function planoSVG(layout,{photo=false,zones=null}={}){
  const F=S.fixture,L=totalLen(),H=F.height,pad=6,lab=10,top=zones?12:6;
  const W=L+pad*2+lab,Ht=H+top+pad;const ox=pad+lab,oy=top;let g='';
  g+=`<rect x="${ox}" y="${oy}" width="${L}" height="${H}" fill="var(--fix)" stroke="var(--line-strong)" stroke-width="0.6"/>`;
  for(let i=1;i<F.elements;i++){const x=ox+i*F.elemWidth;g+=`<line x1="${x}" y1="${oy}" x2="${x}" y2="${oy+H}" stroke="var(--line-strong)" stroke-width="0.5" stroke-dasharray="2 2"/>`}
  g+=`<rect x="${ox}" y="${oy+H-F.base}" width="${L}" height="${F.base}" fill="var(--sunk)" stroke="var(--line-strong)" stroke-width="0.4"/>`;
  let bottom=F.base;
  F.shelves.forEach((cl,si)=>{
    const yb=oy+H-bottom;
    g+=`<text x="${pad+lab-2}" y="${yb-cl/2+1.5}" text-anchor="end" font-size="4" font-family="IBM Plex Mono,monospace" fill="var(--muted)">${si+1}</text>`;
    let x=ox;
    (layout[si]||[]).forEach(it=>{
      if(it.gap){x+=it.gap;return}
      const p=prod(it.pid);const w=p?p.w:(it.estW||10),h=p?p.h:(it.estH||15);const tw=w*it.f;
      const over=h>cl-0.5;const dh=Math.min(h,cl-0.8);const vis=Math.max(0,Math.min(tw,ox+L-x));const clipped=x+tw>ox+L+0.01;
      const bad=over||clipped;
      g+=`<g><title>${esc(p?`${p.name} — ${p.brand}\n${it.f} facing(s) · ${fmt(tw,1)} cm`:(it.label||'Produit non associé'))}</title>`;
      if(photo&&p&&p.img){
        for(let k=0;k<it.f;k++){const lx=x+k*w;if(lx>=ox+L)break;g+=`<image href="${p.img}" x="${lx}" y="${yb-dh}" width="${Math.min(w,ox+L-lx)}" height="${dh}" preserveAspectRatio="none"/>`}
        g+=`<rect x="${x}" y="${yb-dh}" width="${vis}" height="${dh}" fill="none" stroke="${bad?'var(--bad)':'rgba(0,0,0,.45)'}" stroke-width="${bad?1:0.4}"/>`;
        if(tw>=7){const bw=Math.min(vis,3.2+String(it.f).length*2.2);g+=`<rect x="${x}" y="${yb-4.4}" width="${bw}" height="4.4" fill="rgba(20,24,28,.82)"/><text x="${x+0.9}" y="${yb-1.2}" font-size="3" font-family="IBM Plex Mono,monospace" fill="#fff">×${it.f}</text>`}
      }else{
        g+=`<rect x="${x}" y="${yb-dh}" width="${vis}" height="${dh}" fill="${colorFor(p)}" stroke="${bad?'var(--bad)':(p&&p.mdd?'#2a2f33':'rgba(0,0,0,.35)')}" stroke-width="${bad?1:0.4}"${p&&p.mdd?' stroke-dasharray="1.5 1"':''}/>`;
        for(let k=1;k<it.f;k++){const lx=x+k*w;if(lx<ox+L)g+=`<line x1="${lx}" y1="${yb-dh}" x2="${lx}" y2="${yb}" stroke="rgba(0,0,0,.22)" stroke-width="0.3"/>`}
        if(tw>=12){const t=p?p.brand:(it.label||'?');const max=Math.floor(tw/2.1);const s=t.length>max?t.slice(0,max-1)+'…':t;
          g+=`<text x="${x+1.2}" y="${yb-dh+4.6}" font-size="3.4" font-family="IBM Plex Sans,sans-serif" font-weight="600" fill="#14181c">${esc(s)}</text>`;
          if(dh>11)g+=`<text x="${x+1.2}" y="${yb-dh+8.6}" font-size="2.8" font-family="IBM Plex Mono,monospace" fill="#14181c">×${it.f}</text>`}
      }
      g+=`</g>`;x+=tw;
    });
    g+=`<rect x="${ox}" y="${yb}" width="${L}" height="1.6" fill="var(--board)"/>`;
    bottom+=cl;
  });
  if(zones){zones.forEach((z,i)=>{const x=ox+z.x0;
    if(i>0)g+=`<line x1="${x}" y1="${oy-3}" x2="${x}" y2="${oy+H}" stroke="var(--accent)" stroke-width="0.8"/>`;
    const max=Math.floor(z.w/2);const t=z.key.length>max?z.key.slice(0,max-1)+'…':z.key;
    g+=`<text x="${x+z.w/2}" y="${oy-3.5}" text-anchor="middle" font-size="4" font-weight="600" font-family="IBM Plex Sans,sans-serif" fill="var(--accent)">${esc(t)}</text>`})}
  return `<svg viewBox="0 0 ${W} ${Ht}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Planogramme">${g}</svg>`;
}
async function exportPNG(svg,name){
  const cs=getComputedStyle(document.documentElement);
  let s=svg.replace(/var\(--([a-z-]+)\)/g,(m,n)=>cs.getPropertyValue('--'+n).trim()||'#888');
  const vb=s.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);const sc=6;const W=Math.round(+vb[1]*sc),H=Math.round(+vb[2]*sc);
  s=s.replace('<svg ',`<svg width="${W}" height="${H}" `);
  try{const img=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s));
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle=cs.getPropertyValue('--bg').trim()||'#fff';x.fillRect(0,0,W,H);x.drawImage(img,0,0,W,H);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));offerFile(name,blob)}catch(e){toast('Impossible de générer l’image.')}
}

function parseCSV(text){
  const first=text.split(/\r?\n/)[0]||'';const cnt=c=>first.split(c).length;const del=[';',',','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===del){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function prepareImport(rows,source){
  if(rows.length<2)return toast('Le fichier doit contenir une ligne d’en-tête et au moins une ligne de données.');
  const headers=rows[0].map(h=>String(h).trim());const sig=headers.map(norm).join('|');
  let map=S.mappings[sig];let reused=!!map;
  if(!map){map={};FIELDS.forEach(([k])=>{const i=headers.findIndex(h=>SYN[k].includes(norm(h)));map[k]=i})}

    FIELDS.forEach(([k,l])=>{const i=map[k];if(i==null||i<0)return;let v=r[i];if(v==null||String(v).trim()==='')return;
      if(NUMF.includes(k)){const n=num(v);if(n==null)return;if(isNaN(n)||n<0){errors.push(`Ligne ${ri+2} — ${l} : « ${v} » n’est pas un nombre valide.`);return}o[k]=n}
      else if(k==='mdd')o[k]=/^(1|o|oui|y|yes|vrai|true|x)$/i.test(String(v).trim());
      else o[k]=String(v).trim()});
    if(!o.ref&&!o.ean&&!o.name){errors.push(`Ligne ${ri+2} : ni référence, ni EAN, ni nom.`);return}
    out.push(o)});
  return {out,errors};
}
function autoLink(){
  const stop=new Set(['de','du','la','le','les','des','et','x','en','a','l','d','g','kg','ml','cm']);
  const tok=t=>new Set(norm(t).split(' ').filter(w=>w.length>1&&!stop.has(w)&&!/^\d+$/.test(w)));
  const cats=S.catalog.map(p=>({p,t:tok(p.brand+' '+p.name+' '+p.cat),b:norm(p.brand)}));let n=0;
  S.detections.filter(d=>!d.productId&&d.label).forEach(d=>{const lt=tok(d.label);if(!lt.size)return;const ln=norm(d.label);
    const sc=cats.map(c=>{let k=0;lt.forEach(w=>{if(c.t.has(w))k++});return {p:c.p,v:k/lt.size+(c.b&&ln.includes(c.b)?0.3:0)}}).sort((a,b)=>b.v-a.v);
    if(sc[0]&&sc[0].v>=0.6&&(!sc[1]||sc[0].v-sc[1].v>=0.15)){d.productId=sc[0].p.id;d.status='a_verifier';if(d.conf==='elevee')d.conf='moyenne';n++}});

function dataURLtoBlob(u){const [h,b]=u.split(',');const mime=h.match(/:(.*?);/)[1];const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}
function buildPrompt(W,H){
  const F=S.fixture;const cat=S.catalog.slice(0,250).map(p=>`${p.ref} | ${p.name} | ${p.brand} | ${p.cat} | ${fmt(p.w,1)}×${fmt(p.h,1)}×${fmt(p.d,1)} cm`).join('\n');
  return `Tu fais un relevé de merchandising à partir de la photo jointe : un rayon en libre-service de produits emballés.
L’image fait ${W||'?'} × ${H||'?'} pixels.
Mobilier déclaré : ${F.elements} élément(s) de ${F.elemWidth} cm de large, ${F.shelves.length} étagères numérotées de 1 (en bas) à ${F.shelves.length} (en haut).
${cat?`Catalogue de référence (ref | nom | marque | catégorie | L×H×P) :\n${cat}`:'Aucun catalogue fourni : décris chaque produit (marque, produit, format) et mets ref à null.'}

Repère chaque bloc de produits identiques visible (unités identiques côte à côte sur la même étagère = un seul bloc). Pour chaque bloc :
- ref : la référence du catalogue si l’emballage correspond clairement, sinon null. Ne devine pas une ref proche.
- label : ce que tu lis ou vois (marque, produit, format), en français court.
- shelf : numéro d’étagère (1 = bas).
- facings : nombre d’unités en façade (premier rang uniquement, pas la profondeur ni les empilements).
- bbox : [x1, y1, x2, y2] du bloc en pixels de l’image (coin haut gauche puis coin bas droit, origine en haut à gauche).
- confidence : "elevee", "moyenne" ou "faible". Produit masqué, flou ou illisible = "faible".

Réponds uniquement avec ce JSON :
{"quality":{"blur":false,"coverage":"complete","notes":"..."},"shelves_visible":${F.shelves.length},"detections":[{"ref":null,"label":"...","shelf":1,"facings":2,"bbox":[120,640,380,760],"confidence":"moyenne","est_width_cm":null,"est_height_cm":null}]}`;
}

async function callApi(prompt,im,signal){
  const c=apiCfg();const model=c.model||AI_MODELS[0][0];
  const body={model,max_tokens:12000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:im.b64}},{type:'text',text:prompt}]}]};
  let res;
  try{res=c.mode==='proxy'
    ?await fetch(c.url,{method:'POST',headers:{'content-type':'application/json','x-access-code':c.code||''},body:JSON.stringify(body),signal})
    :await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)})}
  catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'network'}}
  const j=await res.json().catch(()=>null);
  if(!res.ok){const t=j&&j.error&&j.error.type;throw {code:res.status===401?'bad_key':res.status===429?'rate_limited':res.status===529||res.status>=500?'upstream_error':t==='invalid_request_error'?'api_invalid':'upstream_error',message:j&&j.error&&j.error.message}}
  const text=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  const m=AI_MODELS.find(x=>x[0]===model)||AI_MODELS[0];const us=j.usage||{};
  return {data:parseJSONText(text),cost:((us.input_tokens||0)*m[2]+(us.output_tokens||0)*m[3])/1e6,tokens:(us.input_tokens||0)+(us.output_tokens||0),truncated:j.stop_reason==='max_tokens'};
}
async function runAI(){

  let wl=null;try{wl=navigator.wakeLock?await navigator.wakeLock.request('screen'):null}catch(e){}
  const aid='A-'+uid();const t0=Date.now();aiBusy=true;aiMsg='Analyse en cours…';aiCtl=new AbortController();refreshAI();
  try{
    const im=await analysisImage();const prompt=buildPrompt(im.W,im.H);let res,cost=null,truncated=false;
    if(aiState==='on'){
      res=await sampleFn.json(prompt,{images:[im.blob],signal:aiCtl.signal,modelTier:'complex',
        onText:()=>{if(aiMsg!=='Réception des détections…'){aiMsg='Réception des détections…';const el=$('#aiZone');if(el){el.innerHTML=aiZone();bindAI()}}}});
    }else{const r=await callApi(prompt,im,aiCtl.signal);res=r.data;cost=r.cost;truncated=r.truncated}
    const list=Array.isArray(res&&res.detections)?res.detections:null;
    if(!list)throw {code:'invalid_json'};
    const n=S.fixture.shelves.length;const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
    S.detections=list.map(d=>{const p=d.ref?S.catalog.find(x=>x.ref.toLowerCase()===String(d.ref).toLowerCase()):null;
      let box=null;
      if(Array.isArray(d.bbox)&&d.bbox.length===4&&d.bbox.every(v=>isFinite(Number(v)))){let [x1,y1,x2,y2]=d.bbox.map(Number);
        x1=clamp(x1,0,im.W);x2=clamp(x2,0,im.W);y1=clamp(y1,0,im.H);y2=clamp(y2,0,im.H);if(x2<x1)[x1,x2]=[x2,x1];if(y2<y1)[y1,y2]=[y2,y1];
        box=[x1/im.W,y1/im.H,Math.max(0.005,(x2-x1)/im.W),Math.max(0.005,(y2-y1)/im.H)]}
      else if(Array.isArray(d.box)&&d.box.length===4&&d.box.every(v=>isFinite(Number(v))&&Number(v)<=1.0001)){box=d.box.map(Number);box[2]=clamp(box[2],0.005,1-box[0]);box[3]=clamp(box[3],0.005,1-box[1])}
      const conf=['elevee','moyenne','faible'].includes(d.confidence)?d.confidence:'faible';
      return {id:uid(),productId:p?p.id:null,label:String(d.label||'Produit'),shelf:clamp(Math.round(Number(d.shelf)||1),1,n),facings:clamp(Math.round(Number(d.facings)||1),1,99),box,
        conf:p?conf:(conf==='elevee'?'moyenne':conf),status:'a_verifier',src:'ia',estW:num(d.est_width_cm)||null,estH:num(d.est_height_cm)||null}});
    S.aiQuality=res.quality||null;
    if(S.catalog.length)autoLink();

    S.quota.used+=u;S.history.push({id:aid,date:new Date().toISOString(),units:u,status:'terminée',n:S.detections.length,secs,cost,via:aiState});

    S.aiRaw={analysis:aid,date:new Date().toISOString(),via:aiState,secs,cost,truncated,image:{w:im.W,h:im.H},response:res};
    S.example=false;aiMsg=truncated?'La réponse a été coupée : certains produits peuvent manquer. Vérifiez la liste.':'';markDirty();save();
    toast(`${S.detections.length} bloc(s) détecté(s) en ${secs} s${cost!=null?` · coût ${fmt(cost,3)} $`:''}. Vérifiez-les avant d’optimiser.`);
  }catch(e){
    const c=e&&e.code;
    if(c!=='cancelled')S.history.push({id:aid,date:new Date().toISOString(),units:0,status:'échouée'});

      bad_key:'Clé API refusée : vérifiez-la dans « Réglages IA ».',network:'Pas de connexion à l’API : vérifiez le réseau. Aucune unité n’a été débitée.',api_invalid:'Requête refusée par l’API'+(e.message?` : ${e.message}`:'.')}[c]||'L’analyse a échoué pour une raison technique. Aucune unité n’a été débitée.');

    save();

function loadPhoto(file){
  if(!/^image\//.test(file.type))return toast('Choisissez une image (JPEG, PNG ou WebP).');
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const max=isMobile()?1600:2000,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);

    const blurry=quickBlur(c);S.aiQuality=blurry?{blur:true,coverage:'?',notes:'La photo semble floue : une nouvelle prise de vue améliorera la détection.'}:null;
    S.example=false;save();renderAll()};
  img.onerror=()=>toast('Image illisible.');img.src=url;
}
function quickBlur(c){try{const w=Math.min(400,c.width),h=Math.round(c.height*w/c.width);const t=document.createElement('canvas');t.width=w;t.height=h;const x=t.getContext('2d');x.drawImage(c,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data;let sum=0,sq=0,n=0;const g=(i)=>d[i]*.3+d[i+1]*.59+d[i+2]*.11;

    ${S.detections.length&&isMobile()?detCards():S.detections.length?`<div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>#</th><th>Vu par l’IA</th><th>Référence</th><th class="num">Étagère</th><th class="num">Facings</th><th>Confiance</th><th>Statut</th><th></th></tr></thead><tbody>${detRows()}</tbody></table></div>`:'<p class="muted">Aucune détection. Lancez l’analyse de la photo ou ajoutez les produits à la main.</p>'}

  const rm=$('#phRemove');if(rm)rm.onclick=()=>{photoMem=null;S.photo=null;S.aiQuality=null;S.detections.forEach(d=>d.box=null);drawMode=false;save();renderAll()};

  $$('[data-row]').forEach(r=>r.addEventListener('focusin',()=>{if(selDet!==r.dataset.row){selDet=r.dataset.row;$$('.bx').forEach(b=>b.classList.toggle('sel',b.dataset.box===selDet));$$('[data-row]').forEach(x=>x.classList.toggle('sel',x===r))}}));
  $$('[data-df]').forEach(inp=>inp.addEventListener('change',()=>{const d=S.detections.find(x=>x.id===inp.dataset.did);const k=inp.dataset.df;
    if(k==='productId'){d.productId=inp.value||null;d.status='validee';if(d.conf==='faible'||d.conf==='moyenne')d.conf='moyenne'}
    else{const v=Math.round(num(inp.value));const max=k==='shelf'?S.fixture.shelves.length:999;if(!(v>=1&&v<=max)){toast(k==='shelf'?`Étagère entre 1 et ${max}.`:'Au moins 1 facing.');inp.value=d[k];return}d[k]=v;d.status='validee'}
    markDirty();save();renderPhoto();renderSide();renderSteps();cropFromPhoto()}));
  $$('[data-step]').forEach(b=>b.onclick=()=>{const d=S.detections.find(x=>x.id===b.dataset.did);const k=b.dataset.step;const max=k==='shelf'?S.fixture.shelves.length:99;
    const v=Math.min(max,Math.max(1,d[k]+(+b.dataset.delta)));if(v===d[k])return;d[k]=v;d.status='validee';selDet=d.id;markDirty();save();renderPhoto();renderSide();renderSteps()});
  $$('[data-validate]').forEach(b=>b.onclick=()=>{const d=S.detections.find(x=>x.id===b.dataset.validate);if(!d.productId)return toast('Associez d’abord une référence, ou créez-la.');d.status='validee';markDirty();save();renderAll()});
  $$('[data-deldet]').forEach(b=>b.onclick=()=>{S.detections=S.detections.filter(d=>d.id!==b.dataset.deldet);markDirty();save();renderAll()});
  $$('[data-mkprod]').forEach(b=>b.onclick=()=>{const d=S.detections.find(x=>x.id===b.dataset.mkprod);
    const p={id:uid(),ref:'REF-'+String(S.catalog.length+1).padStart(3,'0'),ean:'',name:d.label||'Nouvelle référence',brand:(d.label||'—').split(' ')[0],cat:'Sans catégorie',w:d.estW,h:d.estH,d:null,dimSrc:(d.estW&&d.estH)?'estimee':'inconnue',dimOk:false,price:null,ca:null,qty:null,margin:null,mdd:false};
    S.catalog.push(p);d.productId=p.id;d.status='validee';markDirty();save();renderAll();cropFromPhoto();toast('Référence créée. Complétez ses dimensions dans l’étape Dimensions.')});
  const vh=$('#valHigh');if(vh)vh.onclick=()=>{S.detections.forEach(d=>{if(d.conf==='elevee'&&d.productId)d.status='validee'});markDirty();save();renderAll()};
  const xa=$('#expAI');if(xa)xa.onclick=()=>offerFile(`reponse-ia-${slug(S.name)}-${S.aiRaw.date.slice(0,10)}.json`,JSON.stringify(S.aiRaw,null,2));
  $('#addDet').onclick=()=>{S.detections.push({id:uid(),productId:null,label:'',shelf:1,facings:1,box:null,conf:'manuelle',status:'a_verifier',src:'manuel'});save();renderAll()};
}
function bindDraw(){
  const w=$('#phWrap');if(!w||!drawMode)return;let st=null,tmp=null;
  const pt=e=>{const r=w.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
  w.onpointerdown=e=>{e.preventDefault();w.setPointerCapture(e.pointerId);st=pt(e);tmp=document.createElement('div');tmp.className='bx tmp';w.appendChild(tmp)};
  w.onpointermove=e=>{if(!st)return;const p=pt(e);const x=Math.min(st[0],p[0]),y=Math.min(st[1],p[1]);Object.assign(tmp.style,{left:x*100+'%',top:y*100+'%',width:Math.abs(p[0]-st[0])*100+'%',height:Math.abs(p[1]-st[1])*100+'%'})};
  w.onpointerup=e=>{if(!st)return;const p=pt(e);const box=[Math.min(st[0],p[0]),Math.min(st[1],p[1]),Math.abs(p[0]-st[0]),Math.abs(p[1]-st[1])];st=null;tmp.remove();
    if(box[2]<0.01||box[3]<0.01)return;const n=S.fixture.shelves.length;const shelf=Math.min(n,Math.max(1,n-Math.floor((box[1]+box[3]/2)*n)));
    const d={id:uid(),productId:null,label:'',shelf,facings:1,box,conf:'manuelle',status:'a_verifier',src:'manuel'};S.detections.push(d);selDet=d.id;markDirty();save();renderPhoto();renderSide();renderSteps()};
}

/* ---------- 4. Dimensions ---------- */
let dimsAll=false;
function renderDims(){
  const list=dimsAll?S.catalog:usedProducts();const F=S.fixture;
  const estim=d=>S.detections.find(x=>x.productId===d.id&&(x.estW||x.estH));
  $('#main').innerHTML=`<section class="panel">
  <div class="head"><div><h2>Dimensions</h2><p>Chaque dimension garde sa provenance. Une dimension estimée ou manquante bloque l’optimisation tant qu’elle n’est pas confirmée ou mesurée : une photo seule ne donne pas toujours des dimensions fiables.</p></div>
    <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="dimsAll" ${dimsAll?'checked':''}>Tout le catalogue</label></div>
  <div class="card">${list.length&&isMobile()?dimCards(list):list.length?`<div class="tbl-wrap"><table><thead><tr><th>Produit</th><th class="num">Largeur</th><th class="num">Hauteur</th><th class="num">Profondeur</th><th>Provenance</th><th>Contrôle</th><th></th></tr></thead><tbody>
  ${list.map(p=>{const st=dimState(p);const e=estim(p);const deep=p.d>F.depth;const tall=p.h>Math.max(...F.shelves)-1;return `<tr>
    <td style="white-space:normal;min-width:220px"><b>${esc(p.name)}</b><div class="small muted">${esc(p.ref)} · ${esc(p.brand)}${e&&p.dimSrc!=='catalogue'?` · estimation IA ${fmt(e.estW,1)}×${fmt(e.estH,1)} cm`:''}</div>${p.dimNote?`<div class="small muted">Source : ${esc(p.dimNote)}</div>`:''}</td>
    ${['w','h','d'].map(k=>`<td class="num"><input type="number" min="0.5" step="0.1" data-dim="${k}" data-pid="${p.id}" id="dm-${k}-${p.id}" value="${p[k]??''}" aria-label="${k} en cm"></td>`).join('')}
    <td><select data-dsrc="${p.id}" id="dsrc-${p.id}">${Object.entries(DIMSRC).map(([k,l])=>`<option value="${k}" ${p.dimSrc===k?'selected':''}>${l}</option>`).join('')}</select></td>
    <td>${st==='ok'?(deep?'<span class="chip bad">Trop profond</span>':tall?'<span class="chip bad">Trop haut</span>':'<span class="chip ok">Fiable</span>'):st==='tovalidate'?'<span class="chip warn">À confirmer</span>':'<span class="chip bad">Manquante</span>'}</td>
    <td>${st==='tovalidate'?`<button data-dimok="${p.id}">Confirmer</button>`:''}</td></tr>`}).join('')}
  </tbody></table></div>`:'<p class="muted">Aucun produit relevé. Les dimensions à contrôler apparaissent ici dès qu’une détection est associée à une référence.</p>'}
  <p class="small muted" style="margin:10px 0 0">Saisir une valeur la marque comme mesurée. Contraintes du meuble : profondeur ${fmt(F.depth)} cm, dégagement maximal ${fmt(Math.max(...F.shelves))} cm.</p></div></section>`;
  $('#dimsAll').onchange=e=>{dimsAll=e.target.checked;renderDims()};
  $$('[data-dim]').forEach(inp=>inp.addEventListener('change',()=>{const p=prod(inp.dataset.pid);const n=num(inp.value);
    if(n!=null&&!(n>0)){toast('Dimension positive en centimètres.');inp.value=p[inp.dataset.dim]??'';return}
    p[inp.dataset.dim]=n;p.dimSrc=(p.w>0&&p.h>0&&p.d>0)?'mesuree':'inconnue';p.dimOk=true;markDirty();save();renderAll()}));
  $$('[data-dsrc]').forEach(s=>s.onchange=()=>{const p=prod(s.dataset.dsrc);p.dimSrc=s.value;p.dimOk=s.value!=='estimee';markDirty();save();renderAll()});
  $$('[data-dimok]').forEach(b=>b.onclick=()=>{const p=prod(b.dataset.dimok);p.dimOk=true;markDirty();save();renderAll()});
}

function dimCards(list){const F=S.fixture;const L={w:'Largeur',h:'Hauteur',d:'Profondeur'};
  return `<div class="dimcards">${list.map(p=>{const st=dimState(p);const deep=p.d>F.depth;const tall=p.h>Math.max(...F.shelves)-1;return `<div class="dimcard">
    <div><b>${esc(p.name)}</b><div class="small muted">${esc(p.ref)} · ${esc(p.brand)}</div>${p.dimNote?`<div class="small muted">Source : ${esc(p.dimNote)}</div>`:''}</div>
    <div class="dimgrid">${['w','h','d'].map(k=>`<label class="f">${L[k]} (cm)<input type="number" inputmode="decimal" min="0.5" step="0.1" data-dim="${k}" data-pid="${p.id}" id="dm-${k}-${p.id}" value="${p[k]??''}"></label>`).join('')}</div>
    <div class="row"><select data-dsrc="${p.id}" id="dsrc-${p.id}" style="flex:1;min-width:150px" aria-label="Provenance">${Object.entries(DIMSRC).map(([k,l])=>`<option value="${k}" ${p.dimSrc===k?'selected':''}>${l}</option>`).join('')}</select>
      ${st==='ok'?(deep?'<span class="chip bad">Trop profond</span>':tall?'<span class="chip bad">Trop haut</span>':'<span class="chip ok">Fiable</span>'):st==='tovalidate'?'<span class="chip warn">À confirmer</span>':'<span class="chip bad">Manquante</span>'}

      </div></div>
    ${ok&&S.planDirty?'<p class="small" style="margin:8px 0 0;color:var(--warn)">Les données ont changé depuis la génération : régénérez le plan.</p>':''}
    ${!anyImg?'<p class="small muted" style="margin:8px 0 0">Pour un planogramme en photos : analysez une photo du rayon (les produits sont découpés automatiquement) ou ajoutez une photo par référence dans l’étape Chiffres.</p>':S.catalog.some(p=>p.imgSrc==='genere')?'<p class="small muted" style="margin:8px 0 0">Les références sans photo ont un visuel d’emballage généré.</p>':''}
    <div class="plan-stack">
    ${photoMem&&(!ok||planView!=='after')?`<div><p class="plano-title">Photo du rayon <span class="chip neutral">relevé terrain</span></p><div class="plano-box shelf-photo"><img src="${photoMem}" alt="Photo du rayon relevé"></div></div>`:''}
    ${!ok||planView!=='after'?`<div><p class="plano-title">Avant <span class="chip neutral">relevé</span></p><div class="plano-box z-${zoom}">${planoSVG(bl,{photo})}</div></div>`:''}
    ${ok&&planView!=='before'?`<div><p class="plano-title">Après <span class="chip tag">proposition</span><span class="small muted">remplissage ${fmt(pl.fill*100)} %</span></p><div class="plano-box z-${zoom}" id="afterBox">${planoSVG(pl.after,{photo,zones:pl.zones})}</div></div>`:''}
    </div>
    <div class="legend">${legend(photo)}</div>
    ${ok&&pl.warnings.length?`<ul class="issues" style="margin-top:12px">${pl.warnings.map(w=>`<li class="warn">${esc(w.t)}</li>`).join('')}</ul>`:''}
  </div></section>`;
  const upd=fn=>{fn();markDirty();save();renderPlan();renderSide();renderSteps()};
  $$('input[name=obj]').forEach(r=>r.onchange=()=>upd(()=>{st.objective=r.value;st.secondary=st.secondary.filter(k=>k!==r.value)}));
  $$('[data-sec]').forEach(c=>c.onchange=()=>upd(()=>{const k=c.dataset.sec;st.secondary=c.checked?[...new Set([...st.secondary,k])]:st.secondary.filter(x=>x!==k)}));
  ['layout','blocking','order','flow'].forEach(k=>{$('#'+k).onchange=e=>upd(()=>st[k]=e.target.value)});
  $('#periodDays').onchange=e=>{const v=num(e.target.value);if(!(v>=1))return e.target.value=st.periodDays;upd(()=>st.periodDays=v)};
  $('#coverDays').onchange=e=>{const v=num(e.target.value);if(!(v>0))return e.target.value=st.coverDays;upd(()=>st.coverDays=v)};
  $$('[data-rule]').forEach(c=>c.onchange=()=>upd(()=>R[c.dataset.rule]=c.checked));
  $('#storeType').onchange=e=>upd(()=>{st.storeType=e.target.value;st.vis=e.target.value==='GSA'?33:20});
  $('#bulkyIn').onchange=e=>{const v=num(e.target.value);if(!(v>=50))return e.target.value=st.bulkyArea;upd(()=>st.bulkyArea=v)};
  $('#satIn').onchange=e=>{const v=num(e.target.value);if(!(v>=40))return e.target.value=st.sat;upd(()=>st.sat=v)};
  $$('[data-pr]').forEach(i=>i.onchange=()=>upd(()=>{const p=prod(i.dataset.pid);const k=i.dataset.pr;
    if(i.type==='checkbox')p[k]=i.checked;else if(k==='oneFacing')p[k]=i.value||null;else{const v=Math.round(num(i.value));p[k]=v>0?v:null}}));
  $('#gen').onclick=()=>{const r=optimize();S.plan=r;S.planDirty=!!r.blocking;if(r.after){planView='both';S.actions={}}save();renderAll();toast(r.blocking?'Aucun plan valide : voir les contraintes bloquantes.':'Planogramme généré.')};
  $$('[data-view]').forEach(b=>b.onclick=()=>{planView=b.dataset.view;renderPlan()});
  $$('[data-photo]').forEach(b=>b.onclick=()=>{st.photoView=b.dataset.photo==='true';save();renderPlan()});
  $$('[data-zoom]').forEach(b=>b.onclick=()=>{planZoom=b.dataset.zoom;renderPlan()});
  const ts=$('#toggleSettings');if(ts)ts.onclick=()=>{showSettings=!showSettings;renderPlan()};
  const fs=$('#fsBtn');if(fs)fs.onclick=async()=>{const el=$('#afterBox');try{await el.requestFullscreen()}catch(e){planZoom='fit';renderPlan();toast('Plein écran indisponible ici : affichage ajusté à l’écran.')}};
  const pb=$('#pngBtn');if(pb)pb.onclick=()=>exportPNG(planoSVG(pl.after,{photo,zones:pl.zones}),`planogramme-${slug(S.name)}.png`);
}
function legend(photo){const seen=new Map();S.detections.forEach(d=>{const p=prod(d.productId);if(p&&!seen.has(p.brand))seen.set(p.brand,p)});
  return (photo?'':[...seen.values()].map(p=>`<span><i style="background:${colorFor(p)}"></i>${esc(p.brand)}${p.mdd?' (MDD)':''}</span>`).join(''))+'<span><i style="background:transparent;border:1.5px solid var(--bad)"></i>Contrainte dépassée</span>'+(S.plan&&S.plan.zones?'<span><i style="background:var(--accent)"></i>Limite de bloc vertical</span>':'')}

/* ---------- 6. Rapport & actions ---------- */
function actionsFrom(pl){
  return pl.rows.filter(r=>r.before.shelf!==r.after.shelf||r.before.f!==r.after.f||(r.after.shelves||[]).length>1).map(r=>{const p=prod(r.pid);
    const isg=[r.isCA,r.isMB,r.isQ].filter(v=>v!=null);const avg=isg.length?isg.reduce((a,b)=>a+b,0)/isg.length:1;const dev=Math.abs(avg-1);
    const sh=(r.after.shelves||[r.after.shelf]);const parts=[];if(r.before.shelf!==r.after.shelf||sh.length>1)parts.push(sh.length>1?`répartir de l’étagère ${r.before.shelf} sur les étagères ${sh.join(', ')}`:`déplacer de l’étagère ${r.before.shelf} à ${r.after.shelf}`);if(r.before.f!==r.after.f)parts.push(`${r.after.f>r.before.f?'passer':'réduire'} de ${r.before.f} à ${r.after.f} facings`);
    const why=isg.length?`indice relevé ${fmt(avg,2)} : ${avg>1.05?'sous-représenté':avg<0.95?'surreprésenté':'place cohérente'}`+(r.before.shelf!==r.after.shelf?' · niveau ajusté (valeur, critères physiques)':''):'règles de présentation';
    return {pid:r.pid,p,text:parts.join(', '),why,prio:dev>0.5?'Haute':dev>0.2?'Moyenne':'Basse'}}).sort((a,b)=>['Haute','Moyenne','Basse'].indexOf(a.prio)-['Haute','Moyenne','Basse'].indexOf(b.prio));
}
function renderReport(){
  const pl=S.plan;
  if(!pl||!pl.after){$('#main').innerHTML=`<section class="panel"><div class="head"><div><h2>Rapport & actions</h2><p>Générez d’abord un planogramme valide.</p></div></div><div class="card"><button class="primary" data-go="plan">Aller au planogramme</button></div></section>`;return}
  const rows=pl.rows,acts=actionsFrom(pl);const moved=rows.filter(r=>r.before.shelf!==r.after.shelf).length;
  const fB=rows.reduce((a,r)=>a+r.before.f,0),fA=rows.reduce((a,r)=>a+r.after.f,0);
  const ca=rows.reduce((a,r)=>a+(prod(r.pid).ca||0),0),mb=rows.reduce((a,r)=>a+(prod(r.pid).margin||0),0);
  const MLD=totalLen()*S.fixture.shelves.length/100;
  const isCell=v=>v==null?'<td class="num muted">—</td>':`<td class="num"><span class="chip ${v>1.15?'warn':v<0.85?'bad':'ok'}">${fmt(v,2)}</span></td>`;
  const stOpts=['À faire','En cours','Terminé','Bloqué'];
  $('#main').innerHTML=`<section class="panel">
  <div class="head"><div><h2>Rapport & actions</h2><p>Les indices décrivent la situation relevée. Ils ne sont pas une prévision : l’effet réel se mesure après implantation, sur 30 jours par défaut, face à une période de référence.</p><p class="small">Objectif : <b>${esc(OBJ_LABEL[pl.objective]||'')}</b>${(pl.secondary||[]).length?' + '+pl.secondary.map(k=>(SECONDARY.find(x=>x[0]===k)||[])[1]).join(', '):''} · généré le ${new Date(pl.date).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</p></div>
    <div class="row"><button id="expCsv">Exporter le plan (CSV)</button><button id="expJson">Exporter le projet (JSON)</button></div></div>
  <div class="kpis">
    <div class="kpi"><div class="v num">${rows.length}</div><div class="l">Références</div></div>
    <div class="kpi"><div class="v num">${fB} → ${fA}</div><div class="l">Facings</div></div>
    <div class="kpi"><div class="v num">${moved}</div><div class="l">Produits déplacés</div></div>
    <div class="kpi"><div class="v num">${fmt(pl.fill*100)} %</div><div class="l">Remplissage du MLD</div></div>
    ${pl.has.ca?`<div class="kpi"><div class="v num">${fmt(ca/MLD)} €</div><div class="l">CA par m développé (historique)</div></div>`:''}
    ${pl.has.marge?`<div class="kpi"><div class="v num">${fmt(mb/MLD)} €</div><div class="l">Marge par m développé (historique)</div></div>`:''}
  </div>
  <div class="card"><h3>Indices de sensibilité (relevé)</h3>
    <p class="small muted" style="margin:0 0 10px">Indice = part des ventes ÷ part du linéaire occupé. Supérieur à 1 : produit sous-représenté. Inférieur à 1 : surreprésenté.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Produit</th><th class="num">Étagère</th><th class="num">Facings</th><th class="num">Linéaire (cm)</th><th class="num">IS CA</th><th class="num">IS marge</th><th class="num">IS quantités</th><th class="num">Couverture (j)</th><th class="num">Facings min–max</th></tr></thead><tbody>
    ${rows.sort((a,b)=>b.score-a.score).map(r=>{const p=prod(r.pid);return `<tr><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.brand)}${p.mdd?' · MDD':''}</div></td>
      <td class="num mono">${r.before.shelf} → ${(r.after.shelves||[r.after.shelf]).join('+')}</td><td class="num mono">${r.before.f} → ${r.after.f}</td><td class="num mono">${fmt(r.before.lin,1)} → ${fmt(r.after.lin,1)}</td>
      ${isCell(r.isCA)}${isCell(r.isMB)}${isCell(r.isQ)}<td class="num mono">${r.before.cov==null?'—':fmt(r.before.cov,1)+' → '+fmt(r.after.cov,1)}</td><td class="num mono small">${r.minF}–${r.maxF==null||r.maxF===Infinity?'∞':r.maxF}${r.bulky?' <span class="chip ok">1 facing ok</span>':''}</td></tr>`}).join('')}
    </tbody></table></div></div>
  <div class="card"><h3>Plan d’action</h3>
    ${acts.length?`<div class="tbl-wrap"><table><thead><tr><th>Priorité</th><th>Produit</th><th>Modification</th><th>Justification</th><th>Responsable</th><th>Statut</th></tr></thead><tbody>
    ${acts.map(a=>{const s=S.actions[a.pid]||{};return `<tr><td><span class="chip ${a.prio==='Haute'?'bad':a.prio==='Moyenne'?'warn':'neutral'}">${a.prio}</span></td><td>${esc(a.p.name)}<div class="small muted">${esc(a.p.brand)}</div></td><td style="white-space:normal;min-width:200px">${esc(a.text)}</td><td class="small" style="white-space:normal;min-width:160px">${esc(a.why)}</td>
      <td><input type="text" data-act="owner" data-pid="${a.pid}" id="ao-${a.pid}" value="${esc(s.owner||'')}" placeholder="Nom" style="min-width:110px"></td>
      <td><select data-act="status" data-pid="${a.pid}" id="as-${a.pid}" style="min-width:110px">${stOpts.map(o=>`<option ${(s.status||'À faire')===o?'selected':''}>${o}</option>`).join('')}</select></td></tr>`}).join('')}
    </tbody></table></div>`:'<p class="muted">Le plan proposé est identique au relevé : aucune action.</p>'}
  </div></section>`;
  $$('[data-act]').forEach(i=>i.addEventListener('change',()=>{const a=S.actions[i.dataset.pid]||(S.actions[i.dataset.pid]={});a[i.dataset.act]=i.value;save()}));
  $('#expCsv').onclick=()=>{const L=[['etagere','position','ref','nom','marque','facings','largeur_unit_cm','lineaire_cm','etagere_avant','facings_avant']];
    pl.after.forEach((sh,si)=>sh.filter(it=>!it.gap).forEach((it,pi)=>{const p=prod(it.pid);const r=rows.find(x=>x.pid===it.pid);L.push([si+1,pi+1,p.ref,p.name,p.brand,it.f,p.w,(it.f*p.w).toFixed(1),r.before.shelf,r.before.f])}));
    offerFile(`planogramme-${slug(S.name)}.csv`,'﻿'+L.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n'))};
  $('#expJson').onclick=()=>{const c={...S,photo:null};offerFile(`rayonpilot-${slug(S.name)}.json`,JSON.stringify(c,null,2))};
}
const slug=s=>norm(s).replace(/ /g,'-')||'rayon';
async function offerFile(name,data){
  if(!(window.claude&&window.claude.use)){try{const blob=data instanceof Blob?data:new Blob([data],{type:/\.csv$/.test(name)?'text/csv':/\.json$/.test(name)?'application/json':'application/octet-stream'});
    const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Fichier téléchargé.')}catch(e){toast('Export impossible sur cet appareil.')}return}
  const dl=await window.claude.use('downloads');
  if(!dl)return toast('Le téléchargement n’est pas disponible dans cette vue.');
  try{await dl.save({filename:name,data});toast('Fichier enregistré.')}catch(e){if(e&&e.code!=='declined')toast('Export impossible pour le moment.')}
}

/* ---------- rendu global ---------- */
function renderAll(){
  $('#exampleBanner').hidden=!S.example;$('#projName').value=S.name;
  if(S.example){const les=S.exampleKind==='lessive';
    $('#bannerText').innerHTML=isMobile()?(les?'<b>Test sur votre photo</b> : rayon lessive, prix et ventes inventés.':'<b>Exemple</b> : rayon café fictif.'):les?'<b>Test sur votre photo.</b> Rayon lessive : 33 références et 60 blocs relevés sur la photo. Dimensions issues de fiches produits ou mesurées sur la photo ; prix et ventes inventés. Mobilier supposé : 3 × 1 m.':'<b>Données d’exemple.</b> Rayon café fictif (2 éléments, 5 étagères, 10 références). Les marques et chiffres sont inventés.';
    $('#btnSwap').textContent=isMobile()?(les?'Exemple café':'Test lessive'):les?'Voir l’exemple café':'Voir le test lessive';$('#btnNew').textContent=isMobile()?'Projet vide':'Commencer un projet vide'}
  renderSteps();renderSide();
  ({fixture:renderFixture,catalog:renderCatalog,photo:renderPhoto,dims:renderDims,plan:renderPlan,report:renderReport}[S.tab]||renderFixture)();
}
$('#projName').addEventListener('change',e=>{S.name=e.target.value.trim()||'Rayon';save()});
$('#btnNew').onclick=()=>{S=blank();photoMem=null;pending=null;selDet=null;save();renderAll()};
$('#btnSwap').onclick=()=>{S=S.exampleKind==='lessive'?example():lessiveTest();photoMem=S.photo||null;pending=null;selDet=null;boot()};
function deferIfChange(fn){return function(...a){const e=window.event;if(e&&['change','blur','focusout'].includes(e.type))setTimeout(()=>fn.apply(this,a),0);else return fn.apply(this,a)}}
renderAll=deferIfChange(renderAll);renderPlan=deferIfChange(renderPlan);renderPhoto=deferIfChange(renderPhoto);renderFixture=deferIfChange(renderFixture);
renderDims=deferIfChange(renderDims);renderCatalog=deferIfChange(renderCatalog);renderSide=deferIfChange(renderSide);renderSteps=deferIfChange(renderSteps);
MQ.addEventListener&&MQ.addEventListener('change',()=>renderAll());
new MutationObserver(()=>{$$('input[type=number]:not([inputmode])').forEach(i=>i.setAttribute('inputmode',(i.step&&i.step!=='1')?'decimal':'numeric'))}).observe($('#main'),{childList:true,subtree:true});
async function boot(){
  if(S.example){if(photoMem&&S.catalog.some(p=>!p.img))await cropFromPhoto();S.catalog.forEach(p=>{if(!p.img){p.img=genPack(p);p.imgSrc='genere'}})}
  if(S.example&&!S.plan){S.plan=optimize();S.planDirty=!!S.plan.blocking}
  save();renderAll();
}
renderAll();boot();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
